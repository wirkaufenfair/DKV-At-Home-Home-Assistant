# One rule set for the CI and for local runs (CI used the weaker defaults
# before, while local runs picked up other settings).
target-version = "py312"

[lint]
select = [
    "E4", "E7", "E9",  # pycodestyle errors (no line length)
    "F",               # pyflakes
    "I",               # import order
    "UP",              # modern syntax
    "B",               # likely bugs
    "SIM",             # simplifications
    "ASYNC",           # blocking calls in async code
    "RET",             # return statements
    "FURB",            # modern idioms
    "RUF100",          # unused noqa
]
