[pytest]
testpaths = tests
pythonpath = . tests
asyncio_mode = auto
markers =
    contract: talks to the real DKV login servers, no credentials needed
    e2e: full login and read-only API calls, needs DKV_USERNAME and DKV_PASSWORD
# Normal runs stay offline; CI selects the others with -m.
addopts = -m "not contract and not e2e"
