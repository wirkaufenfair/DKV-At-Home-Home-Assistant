blueprint:
  name: DKV@Home – Wallbox automatisch freischalten
  description: >
    Schaltet die Wallbox bei DKV frei, sobald ein Fahrzeug angeschlossen ist.


    DKV bestätigt den Start nur, solange die Wallbox in diesem Moment laden
    darf. Deshalb wird der Schalter bei Bedarf mehrmals eingeschaltet, mit
    einer Pause dazwischen. Die Voreinstellungen (10 Versuche, 2 Minuten
    Pause) stammen aus einer im Alltag erprobten Automation. Läuft schon eine
    Session, passiert nichts. Geht der Sensor auf „aus“, enden die Versuche.


    **Wichtig bei Firmenwagen:** Die Freischaltung läuft über die Karte des
    Kontos, und bei einem Firmenwagen wird jede kWh erstattet. Laden an
    derselben Wallbox auch private Fahrzeuge, darf der Sensor nur „an“
    melden, wenn das Firmenfahrzeug angeschlossen ist. Sonst würde der Strom
    eines privaten Autos als Firmenladung abgerechnet.


    Voraussetzung: die Integration DKV@Home und ein Sensor, der „an“ meldet,
    solange ein Auto angesteckt ist (zum Beispiel von evcc).
  domain: automation
  author: wirkaufenfair
  homeassistant:
    min_version: 2025.1.0
  source_url: https://github.com/wirkaufenfair/DKV-At-Home-Home-Assistant/blob/main/blueprints/automation/dkv_at_home/auto_unlock.yaml
  input:
    vehicle_connected:
      name: Sensor „Fahrzeug angeschlossen“
      description: >
        Meldet „an“, solange ein Fahrzeug angeschlossen ist. Bei Firmenwagen
        mit privaten Mitnutzern: nur für das Firmenfahrzeug (siehe README).
      selector:
        entity:
          domain: binary_sensor
    dkv_switch:
      name: DKV-Schalter
      description: Der Schalter „Ladevorgang“ der Integration DKV@Home.
      selector:
        entity:
          domain: switch
          integration: dkv_at_home
    max_attempts:
      name: Anzahl Versuche
      description: Wie oft der Start versucht wird, bevor aufgegeben wird.
      default: 10
      selector:
        number:
          min: 1
          max: 30
          mode: box
    retry_delay:
      name: Pause zwischen den Versuchen
      description: Wartezeit nach einem Versuch, der nicht bestätigt wurde.
      default: 120
      selector:
        number:
          min: 5
          max: 600
          unit_of_measurement: s
          mode: box
    confirm_wait:
      name: Wartezeit auf die Bestätigung
      description: >
        Wie lange nach dem Einschalten auf den Zustand „an“ gewartet wird,
        bevor der Versuch als gescheitert gilt. Der Schalter zieht seinen
        Zustand mit kleiner Verzögerung nach.
      default: 30
      selector:
        number:
          min: 1
          max: 120
          unit_of_measurement: s
          mode: box
    grace_period:
      name: Wartezeit vor dem ersten Versuch
      description: >
        Optional, aus (0) in der Voreinstellung. So lange kann man noch eine
        andere Karte (zum Beispiel die Partnerkarte für ein privates Fahrzeug)
        an die Wallbox halten oder in der DKV-App freischalten. Wird in dieser
        Zeit freigeschaltet, startet die Blaupause nichts. 0 startet sofort.
      default: 0
      selector:
        number:
          min: 0
          max: 300
          unit_of_measurement: s
          mode: box
    vehicle_sensor:
      name: "Fahrzeugerkennung: Sensor mit dem Fahrzeugnamen (optional)"
      description: >
        Optional, aus in der Voreinstellung. Ein Sensor, der den Namen des
        angeschlossenen Fahrzeugs meldet, zum Beispiel aus evcc. Zusammen mit
        dem Namen unten schaltet die Blaupause nur frei, wenn dieses Fahrzeug
        erkannt wird, andere (zum Beispiel ein privates Auto) bleiben
        unberührt.
      default: ""
      selector:
        entity:
          domain: sensor
    vehicle_name:
      name: "Fahrzeugerkennung: Name des Firmenfahrzeugs (optional)"
      description: >
        Der Name, den der Sensor oben für das Firmenfahrzeug meldet (ohne
        Beachtung von Groß- und Kleinschreibung). Ohne Sensor und Namen ist die
        Fahrzeugerkennung aus.
      default: ""
      selector:
        text: {}
    vehicle_wait:
      name: "Fahrzeugerkennung: Wartezeit"
      description: >
        evcc erkennt das Fahrzeug erst einige Sekunden nach dem Anschließen.
        So lange wird auf den Namen des Firmenfahrzeugs gewartet. Kommt er
        nicht, passiert nichts.
      default: 60
      selector:
        number:
          min: 5
          max: 300
          unit_of_measurement: s
          mode: box
    on_failure:
      name: Aktionen, wenn es nicht klappt
      description: >
        Wird ausgeführt, wenn die Wallbox nach allen Versuchen nicht
        freigeschaltet ist, zum Beispiel eine Meldung aufs Handy.
      default: []
      selector:
        action: {}

# "restart": jeder neue Auslöser beendet einen laufenden Lauf und beginnt neu.
# Geht der Sensor auf "aus", startet deshalb ein neuer Lauf, der gleich im
# ersten Schritt endet. So enden die Versuche beim Abstecken, und es gibt nie
# zwei Läufe gleichzeitig.
mode: restart
max_exceeded: silent

variables:
  dkv_switch: !input dkv_switch
  max_attempts: !input max_attempts
  retry_delay: !input retry_delay
  confirm_wait: !input confirm_wait
  grace_period: !input grace_period
  vehicle_sensor: !input vehicle_sensor
  vehicle_name: !input vehicle_name
  vehicle_wait: !input vehicle_wait

# Ausgelöst nur beim Anschließen (aus -> an), nicht bei "nicht verfügbar -> an"
# und nicht beim Start von Home Assistant: Sonst könnte ein Neustart oder ein
# Ausfall des Sensors bei noch angestecktem Auto eine zusätzliche Session öffnen.
triggers:
  - trigger: state
    entity_id: !input vehicle_connected
    from: "off"
    to: "on"
  - trigger: state
    entity_id: !input vehicle_connected
    to: "off"

# Die Bedingung steht bewusst als erster Schritt der Aktionen und nicht oben
# unter "conditions": Eine oben nicht erfüllte Bedingung würde den neuen Lauf
# gar nicht starten, und der alte Lauf würde weiterlaufen.
actions:
  - condition: state
    entity_id: !input vehicle_connected
    state: "on"
  # Optionale Fahrzeugerkennung (zum Beispiel aus evcc): nur das Firmenfahrzeug
  # freischalten. evcc erkennt das Fahrzeug erst nach dem Anschließen, deshalb
  # wird auf den Namen gewartet. Kommt er nicht, endet der Lauf, ohne etwas zu
  # starten.
  - if:
      - condition: template
        value_template: "{{ vehicle_sensor != '' and vehicle_name != '' }}"
    then:
      - wait_template: "{{ states(vehicle_sensor) | lower == vehicle_name | lower }}"
        timeout: "{{ vehicle_wait | int }}"
        continue_on_timeout: true
      - if:
          - condition: template
            value_template: "{{ states(vehicle_sensor) | lower != vehicle_name | lower }}"
        then:
          - stop: Fahrzeug nicht erkannt
  # Wartezeit vor dem ersten Versuch (Partnerkarte vorhalten oder in der App
  # freischalten). Sie endet vorzeitig, sobald jemand freigeschaltet hat; die
  # Schritte danach schalten nur ein, wenn noch keine Session läuft.
  - if:
      - condition: template
        value_template: "{{ grace_period | int > 0 }}"
    then:
      - wait_template: "{{ is_state(dkv_switch, 'on') }}"
        timeout: "{{ grace_period | int }}"
        continue_on_timeout: true
  - repeat:
      count: "{{ max_attempts | int }}"
      sequence:
        # Zwischen zwei Versuchen warten, vor dem ersten nicht.
        - if:
            - condition: template
              value_template: "{{ repeat.index > 1 }}"
          then:
            - delay:
                seconds: "{{ retry_delay | int }}"
        # Nur einschalten, wenn noch keine Session läuft.
        - if:
            - condition: state
              entity_id: !input dkv_switch
              state: "off"
          then:
            - action: switch.turn_on
              target:
                entity_id: !input dkv_switch
              # Meldet DKV den Start, die Wallbox bestätigt ihn aber nicht
              # innerhalb von 60 Sekunden, gibt der Schalter einen Fehler.
              continue_on_error: true
        # Der Schalter zieht seinen Zustand mit kleiner Verzögerung nach. Ohne
        # dieses Warten könnte nach dem letzten Versuch fälschlich "nicht
        # freigeschaltet" gemeldet werden, obwohl die Session läuft.
        - wait_template: "{{ is_state(dkv_switch, 'on') }}"
          timeout: "{{ confirm_wait | int }}"
          continue_on_timeout: true
        - if:
            - condition: state
              entity_id: !input dkv_switch
              state: "on"
          then:
            - stop: Wallbox freigeschaltet
  - alias: Es hat nicht geklappt
    sequence: !input on_failure
